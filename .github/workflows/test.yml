name: Test

on:
  push:
    branches: ['3.15']
  pull_request:
    branches: ['3.15']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y gettext
      - run: python -m pip install sphinx-lint powrap
      - name: Check reST markup (sphinx-lint)
        run: sphinx-lint --enable all --disable line-too-long *.po */*.po
      - name: Check wrapping (powrap)
        run: powrap --check --quiet *.po */*.po
      - name: Check .po syntax (msgfmt)
        run: for f in *.po */*.po; do msgfmt -c -o /dev/null "$f" || exit 1; done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check out CPython 3.15
        run: git clone --depth 1 --branch 3.15 https://github.com/python/cpython venv/cpython
      - name: Install documentation requirements
        run: python -m pip install -r venv/cpython/Doc/requirements.txt
      - name: Build the Hindi documentation (warnings are errors)
        run: |
          mkdir -p locales/hi_IN/LC_MESSAGES
          cp --parents *.po */*.po locales/hi_IN/LC_MESSAGES/
          make -C venv/cpython/Doc html SPHINXERRORHANDLING=-W \
            SPHINXOPTS="-D locale_dirs=$PWD/locales -D language=hi_IN -D gettext_compact=0 --keep-going"
