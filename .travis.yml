language: python
dist: jammy
python: 3.13
before_install:
  - sudo apt-get update
  - sudo apt-get install -y hunspell hunspell-hi
install:
  - pip install pospell "powrap>=0.3.0"
  - pospell --version
  - powrap --version
script:
  - powrap --check --quiet **/*.po
  - pospell -p dict -l hi_IN **/*.po
  - make CPYTHON_CLONE=/tmp/cpython/
